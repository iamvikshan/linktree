name: CLA Check

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  run-cla:
    uses: iamvikshan/.github/.github/workflows/cla.yml@main
    secrets:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
